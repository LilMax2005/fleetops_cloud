# Kafka UI para administrar brokers, tópicos y consumer groups.
# Requiere el clúster de platform/local/kafka levantado (se une a su red fleetops-kafka-net).
#   cp .env.example .env && docker compose up -d   ->  http://localhost:8090
name: fleetops-kafka-ui

services:
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: kafka-ui
    restart: unless-stopped
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: fleetops
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:29092,kafka-2:29093,kafka-3:29094
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper-1:2181,zookeeper-2:2181,zookeeper-3:2181
      KAFKA_CLUSTERS_0_READONLY: "false"
      DYNAMIC_CONFIG_ENABLED: "true"
      # Acceso protegido con usuario/clave (la UI permite borrar tópicos)
      AUTH_TYPE: LOGIN_FORM
      SPRING_SECURITY_USER_NAME: ${KAFKA_UI_USER:-admin}
      SPRING_SECURITY_USER_PASSWORD: ${KAFKA_UI_PASSWORD:?definir en .env}
    networks: [kafka-net]

networks:
  kafka-net:
    external: true
    name: fleetops-kafka-net
