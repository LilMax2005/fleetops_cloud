spring.application.name=servicio-flota
server.port=${SERVER_PORT:8080}
server.shutdown=graceful

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:fleetops}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.rabbitmq.addresses=${SPRING_RABBITMQ_ADDRESSES:localhost:5672,localhost:5673}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
spring.rabbitmq.connection-timeout=5s
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=false

management.endpoints.web.exposure.include=health

# Topologia RabbitMQ de FleetOps

# Exchanges
fleetops.messaging.exchanges.direct=fleetops.logs.direct
fleetops.messaging.exchanges.topic=${RABBITMQ_ALERTS_EXCHANGE:fleetops.events.topic}
fleetops.messaging.exchanges.dlx=fleetops.dlx.direct

# Colas principales
fleetops.messaging.queues.all=fleetops.logs.all.queue
fleetops.messaging.queues.errors=fleetops.logs.errors.queue
fleetops.messaging.queues.security=fleetops.logs.security.queue

# Dead Letter Queues
fleetops.messaging.dlqs.all=fleetops.logs.all.dlq
fleetops.messaging.dlqs.errors=fleetops.logs.errors.dlq
fleetops.messaging.dlqs.security=fleetops.logs.security.dlq

# Routing keys del Direct Exchange
fleetops.messaging.routing.direct.info=INFO
fleetops.messaging.routing.direct.warning=WARNING
fleetops.messaging.routing.direct.error=ERROR
fleetops.messaging.routing.direct.security=SECURITY

# Patrones del Topic Exchange
fleetops.messaging.routing.topic.all=fleetops.#
fleetops.messaging.routing.topic.errors=fleetops.*.error
fleetops.messaging.routing.topic.security=fleetops.security.#

# Routing keys de las DLQ
fleetops.messaging.routing.dead.all=fleetops.logs.all.dead
fleetops.messaging.routing.dead.errors=fleetops.logs.errors.dead
fleetops.messaging.routing.dead.security=fleetops.logs.security.dead

# Evita reencolar indefinidamente errores no controlados

# Eventos de dominio FleetOps
fleetops.messaging.queues.telemetry=fleetops.telemetry.queue
fleetops.messaging.dlqs.telemetry=fleetops.telemetry.dlq
fleetops.messaging.routing.topic.telemetry=fleetops.telemetry.received
fleetops.messaging.routing.dead.telemetry=fleetops.telemetry.dead

# Reglas configurables de alertas de telemetria
fleetops.telemetry.max-speed-kph=${FLEETOPS_TELEMETRY_MAX_SPEED_KPH:90}
fleetops.telemetry.min-fuel-percent=${FLEETOPS_TELEMETRY_MIN_FUEL_PERCENT:15}
fleetops.demo-data.enabled=${FLEETOPS_DEMO_DATA_ENABLED:false}
fleetops.simulator.service-token=${FLEETOPS_SIMULATOR_SERVICE_TOKEN:}

# Apache Kafka (EP5): streaming de eventos de viaje y telemetria GPS
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}
spring.kafka.client-id=servicio-flota
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=10
spring.kafka.producer.batch-size=32768
spring.kafka.producer.compression-type=lz4
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5
spring.kafka.producer.properties.linger.ms=10
spring.kafka.producer.properties.delivery.timeout.ms=120000
spring.kafka.producer.properties.request.timeout.ms=30000
# Si Kafka no responde, send() no bloquea el hilo mas de 5 s (el flujo RabbitMQ sigue operando)
spring.kafka.producer.properties.max.block.ms=5000
# Los consumidores (servicio-monitoreo) deserializan a su propio tipo: no se envian headers de clase Java
spring.kafka.producer.properties.spring.json.add.type.headers=false
spring.kafka.admin.fail-fast=false
spring.kafka.admin.properties.request.timeout.ms=15000

fleetops.kafka.enabled=${FLEETOPS_KAFKA_ENABLED:true}
fleetops.kafka.create-topics=${FLEETOPS_KAFKA_CREATE_TOPICS:true}
fleetops.kafka.topics.trip-events.name=fleetops.viajes.eventos
fleetops.kafka.topics.trip-events.partitions=3
fleetops.kafka.topics.trip-events.replicas=${KAFKA_REPLICATION_FACTOR:3}
fleetops.kafka.topics.trip-events.configs.retention.ms=604800000
fleetops.kafka.topics.trip-events.configs.min.insync.replicas=${KAFKA_MIN_ISR:2}
fleetops.kafka.topics.trip-events.configs.cleanup.policy=delete
fleetops.kafka.topics.telemetry.name=fleetops.telemetria.gps
fleetops.kafka.topics.telemetry.partitions=6
fleetops.kafka.topics.telemetry.replicas=${KAFKA_REPLICATION_FACTOR:3}
fleetops.kafka.topics.telemetry.configs.retention.ms=86400000
fleetops.kafka.topics.telemetry.configs.segment.ms=3600000
fleetops.kafka.topics.telemetry.configs.min.insync.replicas=${KAFKA_MIN_ISR:2}
fleetops.kafka.topics.telemetry.configs.compression.type=lz4
