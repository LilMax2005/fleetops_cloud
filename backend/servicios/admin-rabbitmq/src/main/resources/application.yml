server:
  port: ${PORT:8082}

spring:
  application:
    name: admin-rabbitmq
  rabbitmq:
    addresses: ${SPRING_RABBITMQ_ADDRESSES:localhost:5672,localhost:5673}
    username: ${SPRING_RABBITMQ_USERNAME:fleetops}
    password: ${SPRING_RABBITMQ_PASSWORD:change_me}

fleetops:
  rabbit:
    management:
      url: ${RABBITMQ_MANAGEMENT_URL:http://localhost:15672}
      username: ${SPRING_RABBITMQ_USERNAME:fleetops}
      password: ${SPRING_RABBITMQ_PASSWORD:change_me}
      vhost: /
  security:
    tenant-id: ${ENTRA_TENANT_ID:72fd0b5a-8a6a-4cff-89f6-bde961f7e250}
    audiences:
      - ${ENTRA_API_CLIENT_ID:30c9b696-b377-4418-9a14-59449389b268}
      - ${ENTRA_API_APP_ID_URI:api://30c9b696-b377-4418-9a14-59449389b268}
    admin-role: FleetOps.Admin
    cors-allowed-origins:
      - http://localhost:4200
      - ${FRONTEND_ORIGIN:https://stfleetopsweb.z1.web.core.windows.net}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    rabbit:
      enabled: false
